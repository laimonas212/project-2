<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/amber.png" />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VF8ZYBL09C"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6Leou88qAAAAAAeYFsOFtcx394MpNQnp7j6PuUtr"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
    </script>


    <!-- Start cookieyes banner -->
    <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/9c4bf2530baf77f3c4583682/script.js"></script>
    <!-- End cookieyes banner -->
    <!-- <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="c7302216-6ce5-4c9a-b458-23d9186ba517" type="text/javascript"></script> -->
    <title>Amber Web</title>
  </head>
  <body style="background: #12121a">
    <div id="root"></div>
    <form style="display: none;" name="contact-form" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <p class="hidden" >
        <label>
          Don't fill this out if you're human: <input name="bot-field" />
        </label>
      </p>
      <input type="hidden" name="form-name" value="contact-form" />
      <input type="hidden" name="name" placeholder="Jūsų vardas" required />
      <input type="hidden" name="email" placeholder="El. paštas" required />
      <input type="hidden" name="phone" placeholder="Telefono numeris" required />
      <textarea name="message" placeholder="Žinutė" rows="4" required class="hidden"></textarea>
      <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">
    </form>

       
      </div>
    </form>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        grecaptcha.ready(function () {
          document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent default form submission

            grecaptcha.execute("6Leou88qAAAAAAeYFsOFtcx394MpNQnp7j6PuUtr", { action: "submit" }).then(function (token) {
              document.getElementById("g-recaptcha-response").value = token;
              event.target.submit(); // Submit the form after adding the token
            });
          });
        });
      });
    </script>
  </body>
</html>
