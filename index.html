	<body style="background: #12121a">
		<div id="root"></div>

		<form
			style="display: none"
			name="contact-form"
			method="POST"
			data-netlify="true"
			netlify-honeypot="bot-field"
		>
			<p class="hidden">
				<label>
					Don't fill this out if you're human:
					<input name="bot-field" />
				</label>
			</p>
			<input type="hidden" name="form-name" value="contact-form" />
			<input
				type="hidden"
				name="name"
				placeholder="Jūsų vardas"
				required
			/>
			<input
				type="hidden"
				name="email"
				placeholder="El. paštas"
				required
			/>
			<input
				type="hidden"
				name="phone"
				placeholder="Telefono numeris"
				required
			/>
			<textarea
				name="message"
				placeholder="Žinutė"
				rows="4"
				required
				class="hidden"
			></textarea>
		</form>

		<script type="module" src="/src/main.tsx"></script>
		<script
			src="https://web3forms.com/client/script.js"
			async
			defer
		></script>
	</body>
